<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Retro Football</title>
  <style>
    html, body { background: #05070c; margin: 0; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none; }
    canvas { width: 100%; max-width: 820px; border: 3px solid #1e293b; border-radius: 10px; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c" width="720" height="420"></canvas>
<script>
let x = c.getContext('2d'), sc = 0, dn = 1, yd = 20, fd = 30, pl = 0, dg = 0, sx = 0, sy = 0, dx = 0, dy = 0, u = 0, d = 0, bt = 0, bn = '', qb, ws, ds, b, aw;
const pn = ['STREAKS', 'SLANTS', 'CROSS', 'FLOOD'];

function pop(t) { bn = t; bt = 45; }

function rst(k) {
  if (k) { sc = 0; dn = 1; yd = 20; fd = 30; }
  else pl = (pl + 1) % 4;
  qb = { x: 85, y: 210 };
  let vy = [[0,0,0], [1.5,-1,-1.5], [2,0,-2], [1.6,1.2,0.8]][pl];
  ws = [
    { x: 135, y: 95, vy: vy[0] },
    { x: 135, y: 210, vy: vy[1] },
    { x: 135, y: 325, vy: vy[2] }
  ];
  ds = [
    { x: 225, y: 95 },
    { x: 225, y: 325 },
    { x: 165, y: 185 },
    { x: 165, y: 235 },
    { x: 460, y: 210 }
  ];
  b = { x: 85, y: 210, vx: 0, vy: 0, s: 0 };
  aw = qb;
}
rst(1);

c.onpointerdown = e => {
  e.preventDefault();
  if (!b.s) { dg = 1; sx = dx = e.offsetX; sy = dy = e.offsetY; }
  else if (b.s == 2) { if (e.offsetY < 210) u = 1; else d = 1; }
};
c.onpointermove = e => { if (dg) { dx = e.offsetX; dy = e.offsetY; } };
window.onpointerup = () => {
  u = d = 0;
  if (dg) {
    dg = 0;
    if (dx - sx > 20) { b.s = 2; aw = qb; pop('QB RUN!'); }
    else { b.s = 1; b.vx = (sx - dx) * 0.12; b.vy = (sy - dy) * 0.12; }
  }
};
window.onkeydown = e => {
  if (e.key == 'w' || e.key == 'ArrowUp') u = 1;
  if (e.key == 's' || e.key == 'ArrowDown') d = 1;
  if ((e.key == 'd' || e.key == 'ArrowRight') && !b.s) { b.s = 2; aw = qb; pop('QB RUN!'); }
  if (e.code == 'Space' && b.s == 2) { aw.x += 28; end(aw.x); }
};
window.onkeyup = e => {
  if (e.key == 'w' || e.key == 'ArrowUp') u = 0;
  if (e.key == 's' || e.key == 'ArrowDown') d = 0;
};

function end(px) {
  let g = Math.round((px - 120) / 5.2);
  yd += g;
  if (yd >= 100) { sc += 7; pop('TOUCHDOWN!!'); rst(0); yd = 20; fd = 30; dn = 1; }
  else if (yd >= fd) { dn = 1; fd = Math.min(100, yd + 10); pop('1ST DOWN!'); rst(0); }
  else {
    dn++; pop(g + ' YDS');
    if (dn > 4) { pop('TURNOVER!'); rst(1); }
    else rst(0);
  }
}

function guy(px, py, j, h) {
  x.fillStyle = '#fff'; x.fillRect(px - 6, py + 5, 12, 7);
  x.fillStyle = j; x.fillRect(px - 9, py - 7, 18, 12);
  x.fillStyle = '#fff'; x.fillRect(px - 4, py - 4, 8, 6);
  x.fillStyle = h; x.fillRect(px - 7, py - 18, 14, 11);
  x.fillStyle = '#94a3b8'; x.fillRect(px + 3, py - 15, 5, 5);
}

setInterval(() => {
  if (!b.s) {
    ws.forEach(w => {
      w.x += 2.2; w.y += w.vy;
      if (w.y < 65 || w.y > 355) w.vy *= -1;
      if (w.x > 630) w.x = 135;
    });
    ds[0].x += 2.1; ds[0].y += (ws[0].y - ds[0].y) * 0.08;
    ds[1].x += 2.1; ds[1].y += (ws[2].y - ds[1].y) * 0.08;
    ds[2].x -= 0.55; ds[3].x -= 0.55;
    ds[4].y += (ws[1].y - ds[4].y) * 0.05;
    if (ds[2].x < 95) { pop('SACKED!'); end(95); }
  } else if (b.s == 1) {
    b.x += b.vx; b.y += b.vy; b.vy += 0.15;
    aw = ws.reduce((a, c) => Math.hypot(b.x - c.x, b.y - c.y) < Math.hypot(b.x - a.x, b.y - a.y) ? c : a);
    let ag = Math.atan2(b.y - aw.y, b.x - aw.x);
    aw.x += Math.cos(ag) * 3.5; aw.y += Math.sin(ag) * 3.5;
    if (ds.some(df => Math.hypot(b.x - df.x, b.y - df.y) < 21)) { pop('INT!'); rst(1); }
    else if (Math.hypot(b.x - aw.x, b.y - aw.y) < 23) { b.s = 2; pop('CAUGHT!'); }
    else if (b.x > 710 || b.y > 380 || b.y < 40) { pop('MISS!'); end(120); }
  } else {
    aw.x += 3.1;
    if (u) aw.y = Math.max(55, aw.y - 4.5);
    if (d) aw.y = Math.min(365, aw.y + 4.5);
    ds.forEach(df => {
      let a = Math.atan2(aw.y - df.y, aw.x - df.x);
      df.x += Math.cos(a) * 2.8; df.y += Math.sin(a) * 2.8;
      if (Math.hypot(aw.x - df.x, aw.y - df.y) < 20) { pop('TACKLED!'); end(aw.x); }
    });
    if (aw.x >= 120 + (100 - yd) * 5.2) end(999);
  }

  x.fillStyle = '#15803d'; x.fillRect(0, 0, 720, 420);
  x.fillStyle = '#166534'; for (let i = 0; i < 720; i += 104) x.fillRect(i, 42, 52, 336);
  x.fillStyle = '#090d16'; x.fillRect(0, 0, 720, 42); x.fillRect(0, 378, 720, 42);
  for (let i = 16; i < 700; i += 24) { x.fillStyle = i % 48 ? '#38bdf8' : '#facc15'; x.fillRect(i, 386, 12, 10); }
  x.strokeStyle = '#fff'; x.lineWidth = 2;
  for (let i = 16; i < 720; i += 52) { x.beginPath(); x.moveTo(i, 42); x.lineTo(i, 378); x.stroke(); }

  let ez = 120 + (100 - yd) * 5.2;
  if (ez < 720) {
    x.fillStyle = '#dc2626'; x.fillRect(ez, 42, 720 - ez, 336);
    x.fillStyle = '#facc15'; x.fillRect(ez - 4, 42, 8, 8); x.fillRect(ez - 4, 370, 8, 8);
  }
  let fdx = 120 + (fd - yd) * 5.2;
  x.strokeStyle = '#3b82f6'; x.lineWidth = 4; x.beginPath(); x.moveTo(120, 42); x.lineTo(120, 378); x.stroke();
  if (fdx < 720) { x.strokeStyle = '#facc15'; x.beginPath(); x.moveTo(fdx, 42); x.lineTo(fdx, 378); x.stroke(); }

  x.fillStyle = '#fff'; x.font = '900 17px monospace';
  x.fillText('PTS:' + sc + ' | ' + dn + 'DN TO ' + (fd - yd) + ' | ' + pn[pl], 130, 27);

  if (dg && dx < sx) {
    x.fillStyle = '#facc15';
    let vx = (sx - dx) * 0.12, vy = (sy - dy) * 0.12;
    for (let t = 1; t < 40; t += 3) x.fillRect(qb.x + vx * t - 3, qb.y + vy * t + 0.075 * t * t - 3, 6, 6);
  }

  guy(qb.x, qb.y, '#2563eb', '#facc15');
  [180, 210, 240].forEach(oy => guy(125, oy, '#2563eb', '#facc15'));
  ws.forEach(w => guy(w.x, w.y, '#2563eb', '#facc15'));
  ds.forEach(df => guy(df.x, df.y, '#dc2626', '#fff'));
  if (b.s < 2) { x.fillStyle = '#78350f'; x.fillRect(b.x - 6, b.y - 4, 12, 8); }

  if (bt > 0) {
    bt--;
    x.fillStyle = 'rgba(9, 13, 22, 0.9)'; x.fillRect(190, 175, 340, 58);
    x.strokeStyle = '#facc15'; x.strokeRect(190, 175, 340, 58);
